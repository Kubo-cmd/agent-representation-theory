[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-representation-theory"
version = "0.1.0"
description = "Finite-group representation tools for agent-symmetry experiments"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LYTA.EXE contributors"}]
dependencies = [
  "numpy>=1.23,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools]
py-modules = ["agent_representation_theory"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["test_representation_theory.py"]
